<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바른몸 관리자 | 로그인</title>
    <link rel="stylesheet" href="/admin/style.css?v=1.2">
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <img src="/assets/logo.svg" alt="바른몸 로고" width="60">
                <h2>BAREUNMOM <strong>ADMIN</strong></h2>
            </div>
            <p>관리자 계정으로 로그인해 주세요.</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" placeholder="아이디를 입력하세요" required>
                </div>
                <div class="input-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                </div>
                <button type="submit" class="btn-login">로그인</button>
            </form>
            <div class="login-footer">
                <a href="../index.html">← 홈페이지로 돌아가기</a>
            </div>
        </div>
    </div>
    <script src="/data.js"></script>
    <script src="/admin/main.js"></script>
</body>
</html>
